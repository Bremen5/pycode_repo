# Netlify 無料プラン向けの設定
[build]
  command = "npm run build"
  publish = "dist"
  # main 以外のブランチ（develop など）とドキュメントだけの変更ではビルドしない
  ignore = "sh scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

# develop ブランチやプルリクエストのプレビューを作らない（ignore と二重の対策）
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

# assets/ は長期キャッシュ（CSS はファイル名に内容のハッシュが入るので安全に更新できる）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
