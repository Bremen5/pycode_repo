<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>{% block title %}カリステニクス{% endblock %}</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --card: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --muted: #888;
      --success: #4caf50;
      --warning: #ff9800;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: var(--surface);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #2a2a3e;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #2a2a3e;
    }
    .card-title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* flash messages */
    .flash {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      font-size: 14px;
    }
    .flash.success { background: #1b3a1e; color: #81c784; border: 1px solid #2e5731; }
    .flash.error   { background: #3a1b1b; color: #e57373; border: 1px solid #5c2b2b; }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: var(--radius);
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
      min-height: 48px;
    }
    .btn:active { opacity: .75; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--accent2); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid #2a2a3e; }
    .btn-danger { background: #5c2b2b; color: #e57373; }
    .btn-block { display: flex; width: 100%; margin-bottom: 8px; }
    .btn-sm { padding: 8px 14px; font-size: 13px; min-height: 36px; }

    /* forms */
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 14px;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    select option { background: var(--surface); }

    /* exercise group */
    .ex-group { margin-bottom: 20px; }
    .ex-group-title {
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a3e;
    }
    .set-row:last-child { border-bottom: none; }
    .set-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      padding: 2px 8px;
      border-radius: 20px;
      margin-right: 8px;
    }
    .set-value { font-size: 18px; font-weight: 700; }
    .set-unit  { font-size: 13px; color: var(--muted); margin-left: 2px; }
    .set-note  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* stat tiles */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-tile {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      border: 1px solid #2a2a3e;
    }
    .stat-num  { font-size: 28px; font-weight: 800; color: var(--accent); }
    .stat-label{ font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* bottom nav */
    nav.bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid #2a2a3e;
      display: flex;
      z-index: 20;
    }
    nav.bottom a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      gap: 3px;
    }
    nav.bottom a.active { color: var(--accent); }
    nav.bottom a .icon { font-size: 20px; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 20px 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chip {
      display: inline-block;
      background: var(--accent2);
      color: #aac;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 4px;
    }

    .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }

    /* delete form inline */
    .delete-form { display: inline; }
    .delete-form button {
      background: none; border: none; cursor: pointer;
      color: #5c3a3a; font-size: 18px; padding: 4px 8px;
    }
    .delete-form button:active { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>{% block header %}カリステニクス{% endblock %}</h1>
    <div class="sub">{% block header_sub %}{% endblock %}</div>
  </header>

  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <nav class="bottom">
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">
      <span class="icon">💪</span>今日
    </a>
    <a href="{{ url_for('record') }}" class="{% if request.endpoint == 'record' %}active{% endif %}">
      <span class="icon">➕</span>記録
    </a>
    <a href="{{ url_for('history') }}" class="{% if request.endpoint == 'history' %}active{% endif %}">
      <span class="icon">📅</span>履歴
    </a>
    <a href="{{ url_for('progress_list') }}" class="{% if request.endpoint in ('progress_list','progress') %}active{% endif %}">
      <span class="icon">📈</span>進捗
    </a>
    <a href="{{ url_for('stats') }}" class="{% if request.endpoint == 'stats' %}active{% endif %}">
      <span class="icon">🏆</span>統計
    </a>
  </nav>
</body>
</html>
